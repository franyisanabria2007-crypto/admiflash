<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pedidos Flash — Panel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/styles.css" />
  <script src="./catalogo/catalogo-produ.js"></script>
  <script src="./js/admin-app.js" defer></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">
  <!-- Encabezado -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-brand-600/20 border border-brand-500/40 flex items-center justify-center glow-cyan">
        <i data-lucide="zap" class="w-5 h-5 text-accent-cyan"></i>
      </div>
      <div>
        <h1 class="font-orbitron text-sm font-extrabold tracking-wide text-white">PEDIDOS FLASH</h1>
        <p class="text-[11px] text-slate-400">Consola de Administración</p>
      </div>
    </div>
    <span id="cant-admin-prods-badge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-800 text-accent-cyan border border-slate-700">0</span>
  </header>

  <!-- Navegación por pestañas -->
  <nav class="grid grid-cols-3 gap-2 p-3 bg-slate-900/60 border-b border-slate-800/80">
    <button type="button" data-tab="resumen" class="tab-btn btn-tactil py-2 px-3 rounded-xl text-xs font-bold bg-brand-600 text-white">Resumen</button>
    <button type="button" data-tab="catalogo" class="tab-btn btn-tactil py-2 px-3 rounded-xl text-xs font-bold bg-slate-800 text-slate-300">Catálogo</button>
    <button type="button" data-tab="radar" class="tab-btn btn-tactil py-2 px-3 rounded-xl text-xs font-bold bg-slate-800 text-slate-300">Radar</button>
  </nav>

  <!-- Contenido principal -->
  <main class="flex-1 p-4 space-y-4 max-w-4xl w-full mx-auto">
    <section id="panel-resumen" class="tab-panel space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 glow-emerald">
          <p class="text-xs text-slate-400">Productos activos</p>
          <p id="metrica-productos-total" class="text-2xl font-extrabold text-accent-emerald mt-1">0</p>
        </div>
        <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 glow-yellow">
          <p class="text-xs text-slate-400">Pedidos en curso</p>
          <p id="metrica-pedidos-activos" class="text-2xl font-extrabold text-accent-yellow mt-1">0</p>
        </div>
      </div>
      <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800">
        <h2 class="text-sm font-bold text-white mb-1">Estado del sistema</h2>
        <p class="text-xs text-slate-400">Estructura modular lista para Android WebView o Capacitor.</p>
      </div>
    </section>

    <section id="panel-catalogo" class="tab-panel hidden space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-white">Catálogo de Productos</h2>
        <span class="text-xs text-slate-400">Base inicial</span>
      </div>
      <div id="lista-catalogo-admin" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>

    <section id="panel-radar" class="tab-panel hidden space-y-3">
      <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800">
        <div class="flex items-center gap-3">
          <div class="pin-radar-chofer text-xs">R</div>
          <div>
            <h2 class="text-sm font-bold text-white">Radar de Reparto</h2>
            <p class="text-xs text-slate-400">Conecta tu fuente de ubicaciones en tiempo real en <code class="text-accent-cyan">js/admin-app.js</code>.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
